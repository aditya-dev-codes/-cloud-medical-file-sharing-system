{% extends 'base.html' %}

{% block title %}Login - MediCloud Share{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h1>Sign In</h1>
            <p>Access your secure medical cloud and emergency profile</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input 
                    type="text" 
                    id="identifier" 
                    name="identifier" 
                    class="form-control" 
                    value="{{ identifier or '' }}" 
                    placeholder="Enter your username or email" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                Log In
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
            Don't have an account yet? 
            <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
